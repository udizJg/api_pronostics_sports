[project]
name = "ia-pronostics"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jesús Udiz", email = "jesusgabrieludiz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
ia-pronostics = "ia_pronostics:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
[tool.ruff]
line-length = 88
target-version = "py313"
[tool.ruff.format]
quote-style = "double"
